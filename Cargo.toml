[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
machish = { path = "crates/machish" }
darwin = { path = "crates/darwin" }
objc = { path = "crates/objc" }
corefoundation = { path = "crates/corefoundation" }
libc = "0.2"
gimli = "0.34"
