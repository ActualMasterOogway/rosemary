[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
machish = { path = "crates/machish" }
darwin = { path = "crates/darwin" }
objc = { path = "crates/objc" }
corefoundation = { path = "crates/corefoundation" }
foundation = { path = "crates/foundation" }
sdl3 = { path = "crates/sdl3" }
iokit = { path = "crates/iokit" }
appkit = { path = "crates/appkit" }
corevideo = { path = "crates/corevideo" }
coreaudio = { path = "crates/coreaudio" }
libc = "0.2"
gimli = "0.34"

[profile.fullnative]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
target-cpu = "native"
