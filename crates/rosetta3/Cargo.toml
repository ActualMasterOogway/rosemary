[package]
name = "rosetta3"
description = "Run Intel macOS applications on Apple Silicon atop the Microlift JIT recompiler"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
machish.workspace = true
# The shims call host libc directly (stdio for the `printf` family, `errno` for
# diagnostics). `machish` keeps `libc` optional; the driver is `std`-only
# anyway, so here it is unconditional.
libc.workspace = true
# For `iced_x86::Register`, which is what a `microlift` `GuestReg` payload
# actually is. Resolving one is how an `ArgLocation::IntReg` becomes a field of
# the guest register context; the alternative is matching raw register numbers.
iced-x86 = "1"
# A path dependency, deliberately outside this workspace: `machish` must stay
# publishable and free of any microlift coupling, so the two only ever meet
# here. See `docs/ROADMAP.md`, "the microlift seam".
microlift = { path = "../../../microlift" }
# Host->guest thunks are compiled, not assembled: a trampoline is a handful of
# Cranelift IR instructions, and letting the compiler emit the prologue and the
# argument moves is what keeps this crate free of hand-written arm64. Same
# version as `microlift`'s, deliberately — the `Function` built here is handed
# to `microlift::backend::CraneliftBackend`, so the two must be one crate.
cranelift-codegen = "0.133"
cranelift-frontend = "0.133"

[dev-dependencies]
# The ABI tests call real host libSystem functions through the marshaller, and
# `dlsym` them to find the addresses in the first place.
libc.workspace = true
