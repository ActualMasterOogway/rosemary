[package]
name = "rosetta3"
description = "Run Intel macOS applications on Apple Silicon or Intel Macs atop the Microlift JIT recompiler"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
machish.workspace = true
darwin.workspace = true
objc.workspace = true
corefoundation.workspace = true
iokit.workspace = true
foundation.workspace = true
appkit.workspace = true
applicationservices.workspace = true
audiotoolbox.workspace = true
sdl3.workspace = true
corevideo.workspace = true
coreaudio.workspace = true
contacts.workspace = true
gamecontroller.workspace = true
webkit.workspace = true
forcefeedback.workspace = true
metal.workspace = true
gimli.workspace = true
libc.workspace = true
static_init.workspace = true
iced-x86 = "1"
microlift = { git = "https://github.com/microlift/microlift", features = ["disasm", "runtime"] }
cranelift-codegen = { git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental", version = "0.137.0-dev", default-features = false, features = ["std", "unwind", "host-arch"] }
cranelift-frontend = {git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental", version = "0.137.0-dev" }
cranelift-native = { git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental", version = "0.137.0-dev" }
# `override` feature disabled on macOS for now because it has a bug where it improperly sets `_malloc_fork` info,
# causing child processes to get their memory allocator corrupted.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = "0.1.52"

[target.'cfg(not(target_os = "macos"))'.dependencies]
mimalloc = { version = "0.1.52", features = ["override"] }

[dev-dependencies]
libc.workspace = true
darwin.workspace = true
