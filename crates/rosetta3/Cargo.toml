[package]
name = "rosetta3"
description = "Run Intel macOS applications on Apple Silicon or Intel Macs atop the Microlift JIT recompiler"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
machish.workspace = true
gimli.workspace = true
libc.workspace = true
iced-x86 = "1"
microlift = { git = "https://github.com/microlift/microlift", branch = "dev/block_linking", features = ["disasm", "runtime"] }
cranelift-codegen = { git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental", version = "0.136.0-dev", default-features = false, features = ["std", "unwind", "host-arch"] }
cranelift-frontend = {git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental", version = "0.136.0-dev" }
cranelift-native = { git = "https://github.com/microlift/wasmtime", branch = "microlift_experimental", version = "0.136.0-dev" }

static_init = "1.0.4"

[dev-dependencies]
libc.workspace = true
