[package]
name = "darwin"
description = "A shim for the Darwin libc, libsystem, and other low level Darwin facilities that can be easily bridged to the host libc."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
machish.workspace = true
exports = { workspace = true, features = ["machish"] }
objc.workspace = true
prefix.workspace = true
libc.workspace = true
libm.workspace = true
backtrace.workspace = true
static_init.workspace = true
getrandom.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
aes.workspace = true
blowfish.workspace = true
cast5.workspace = true
cipher.workspace = true
des.workspace = true
rc2.workspace = true
rc4.workspace = true
rustix.workspace = true
posix-regex = { path = "../posix-regex" }
fancy-regex = { version = "0.19.2", features = ["leftmost_longest"] }
